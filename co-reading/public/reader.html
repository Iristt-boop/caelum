<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>共读</title>
    <!-- ?v= 是给部署用的：静态文件服务不发 Cache-Control / ETag，
         不带版本号改了 CSS 浏览器可能还吃旧的。改样式时把日期一起改。 -->
    <link rel="stylesheet" href="/reader.css?v=20260729b" />
  </head>
  <body>
    <main class="app">
      <section class="sidebar" aria-label="图书馆">
        <header class="topbar">
          <div>
            <p class="eyebrow">共读</p>
            <h1>图书馆</h1>
          </div>
          <div class="topbar-actions">
            <button id="import-book" class="icon-button" title="导入 EPUB 或 TXT">＋</button>
            <button id="refresh" class="icon-button" title="刷新图书馆">↻</button>
          </div>
          <input id="import-file" type="file" accept=".epub,.txt,.text,.md,.markdown" multiple hidden />
        </header>
        <div id="books" class="books" aria-live="polite"></div>
      </section>

      <section class="chapters" aria-label="目录">
        <header class="panel-head">
          <p id="book-meta" class="eyebrow">选择一本书</p>
          <h2 id="book-title">书架</h2>
        </header>
        <div id="chunks" class="chunk-list"></div>
      </section>

      <section class="reader" aria-label="阅读">
        <header class="reader-head">
          <div>
            <p id="chunk-file" class="eyebrow">未选择章节</p>
            <h2 id="chunk-title">打开一章开始阅读</h2>
          </div>
          <div class="reader-actions">
            <button id="show-card" class="secondary-button" disabled>卡片</button>
            <button id="continue-reading" class="secondary-button" disabled>继续</button>
            <button id="mark-read" class="secondary-button" disabled>标记已读</button>
          </div>
        </header>

        <article id="text" class="text">
          <p class="empty">选择一本书和章节。选中文字即可留言给 Claude。</p>
        </article>

        <aside id="margins" class="margins" aria-label="页边笔记"></aside>

        <form id="note-form" class="note-form" hidden>
          <div class="quote-preview" id="quote-preview"></div>
          <textarea id="note" rows="3" placeholder="给 Claude 留个笔记..."></textarea>
          <div class="form-actions">
            <button type="button" id="cancel-note" class="secondary-button">取消</button>
            <button type="submit" class="primary-button">保存笔记</button>
          </div>
        </form>

        <footer class="submitbar">
          <span id="status">私人笔记留在本地，直到你发送。</span>
          <div class="submit-actions">
            <button id="note-selection" class="secondary-button" disabled>标注选中</button>
            <button id="submit-notes" class="primary-button" disabled>发送给 Claude</button>
          </div>
        </footer>

        <div id="toast" class="toast" hidden></div>

        <aside id="card-panel" class="card-panel" hidden aria-label="阅读卡片">
          <div class="card-panel-head">
            <div>
              <p class="eyebrow">仪式卡片</p>
              <h2>共享印记</h2>
            </div>
            <button id="card-close" class="icon-button" title="关闭">×</button>
          </div>
          <div id="card-preview" class="card-preview"></div>
          <div class="card-actions">
            <button id="card-random" class="secondary-button">换一张</button>
          </div>
        </aside>
      </section>
    </main>
    <!-- 同 CSS：静态服务不发缓存头，改了 JS 要一起改这个日期。
         2026-08-04 之前这里是缺的 —— 于是改 CSS 生效、改 JS 不生效，
         「有时候改了没反应」就是这么来的。 -->
    <script type="module" src="/reader.js?v=20260804"></script>
  </body>
</html>
