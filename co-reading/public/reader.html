<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>共读</title>
    <!-- ?v= 是给部署用的：静态文件服务不发 Cache-Control / ETag，
         不带版本号改了 CSS 浏览器可能还吃旧的。改样式时把日期一起改。 -->
    <link rel="stylesheet" href="/reader.css?v=20261014" />
  </head>
  <body>
    <main class="app">
      <section class="sidebar" aria-label="图书馆">
        <header class="topbar">
          <div>
            <p class="eyebrow">共读</p>
            <h1>图书馆</h1>
          </div>
          <div class="topbar-actions">
            <button id="import-book" class="icon-button" title="导入 EPUB 或 TXT">＋</button>
            <button id="refresh" class="icon-button" title="刷新图书馆">↻</button>
          </div>
          <input id="import-file" type="file" accept=".epub,.txt,.text,.md,.markdown" multiple hidden />
        </header>
        <div id="books" class="books" aria-live="polite"></div>
      </section>

      <section class="chapters" aria-label="目录">
        <header class="panel-head">
          <p id="book-meta" class="eyebrow">选择一本书</p>
          <h2 id="book-title">书架</h2>
        </header>
        <div id="chunks" class="chunk-list"></div>
      </section>

      <section class="reader" aria-label="阅读">
        <header class="reader-head">
          <div>
            <p id="chunk-file" class="eyebrow">未选择章节</p>
            <h2 id="chunk-title">打开一章开始阅读</h2>
          </div>
          <div class="reader-actions">
            <button id="continue-reading" class="secondary-button" disabled>继续</button>
          </div>
        </header>

        <div id="recap-banner" class="recap-banner" hidden>
          <span id="recap-banner-text">距你上次翻开已有一阵了</span>
          <button id="recap-go" class="banner-action" type="button">让他给我讲讲前情</button>
          <button id="recap-dismiss" class="banner-dismiss" type="button" aria-label="收起前情条">×</button>
        </div>

        <article id="text" class="text">
          <p class="empty">选择一本书和章节。选中文字即可收藏或留言。</p>
        </article>

        <aside id="margins" class="margins" aria-label="页边笔记"></aside>

        <form id="note-form" class="note-form" hidden>
          <div class="quote-preview" id="quote-preview"></div>
          <textarea id="note" rows="3" placeholder="给 Claude 留个笔记..."></textarea>
          <div class="form-actions">
            <button type="button" id="cancel-note" class="secondary-button">取消</button>
            <button type="submit" class="primary-button">保存笔记</button>
          </div>
        </form>

        <footer class="submitbar">
          <span id="status">私人笔记留在本地，直到你发送。</span>
          <div class="submit-actions">
            <button id="collect-selection" class="secondary-button" disabled>✦ 收藏</button>
            <button id="note-selection" class="secondary-button" disabled>写批注</button>
            <button id="ask-selection" class="secondary-button" disabled>问他</button>
            <button id="submit-notes" class="primary-button" disabled>发送给 Claude</button>
          </div>
        </footer>

        <div id="toast" class="toast" hidden></div>

        <div class="fabs">
          <button id="fab-mic" class="fab fab-mic" type="button" aria-label="边读边聊">◉</button>
          <button id="fab-fold" class="fab fab-fold" type="button" aria-label="折痕">✦<span id="fold-badge" class="fold-badge" hidden></span></button>
        </div>

        <div id="intercom" class="intercom" hidden>
          <div class="ic-head">
            <span id="ic-dot" class="ic-dot"></span>
            <span id="ic-status" class="ic-status">边读边聊 · 他听得见你读到哪</span>
            <button id="ic-close" class="ic-close" type="button" aria-label="收起对讲">×</button>
          </div>
          <div id="ic-body" class="ic-body">
            <p class="ic-hint">点麦克风直接说话，或打字。他就坐在你旁边读同一本。</p>
          </div>
          <form id="ic-form" class="ic-form">
            <button type="button" id="ic-mic" class="ic-mic" aria-label="按住说话">◉</button>
            <input id="ic-input" type="text" placeholder="或者打字…" autocomplete="off" />
            <button type="submit" class="ic-send">发送</button>
          </form>
        </div>

        <div id="drawer-wrap" class="drawer-wrap" hidden>
          <div class="drawer-dim" id="drawer-dim"></div>
          <div class="drawer">
            <div class="drawer-grab"></div>
            <div class="drawer-tabs" role="tablist" aria-label="折痕">
              <button id="tab-collects" class="drawer-tab active" type="button">收藏</button>
              <button id="tab-cards" class="drawer-tab" type="button">卡册</button>
              <button id="tab-recap" class="drawer-tab" type="button">前情</button>
            </div>
            <div class="drawer-panel" id="panel-collects">
              <p class="drawer-cap">整本书的收藏 · 点一条跳回原文</p>
              <div id="collect-list"></div>
              <p class="drawer-empty" id="collect-empty">划选正文 → ✦ 收藏，整本书的句子都归在这里。</p>
            </div>
            <div class="drawer-panel" id="panel-cards" hidden>
              <p class="drawer-cap">折痕卡 · 章节读完、同段回声、合卷</p>
              <div id="card-list"></div>
              <p class="drawer-empty" id="card-empty">还没有卡。读完一章，会自动收到第一枚。</p>
            </div>
            <div class="drawer-panel" id="panel-recap" hidden>
              <p class="drawer-cap">前情 · 回访时他在你们的折痕里找出来的</p>
              <div id="recap-list"></div>
              <p class="drawer-empty" id="recap-empty">打开一本读到一半的书，「前情」会落在这里。</p>
            </div>
          </div>
        </div>
      </section>
    </main>
    <!-- 同 CSS：静态服务不发缓存头，改了 JS 要一起改这个日期。
         2026-08-04 之前这里是缺的 —— 于是改 CSS 生效、改 JS 不生效，
         「有时候改了没反应」就是这么来的。 -->
    <script type="module" src="/reader.js?v=20261014"></script>
  </body>
</html>
