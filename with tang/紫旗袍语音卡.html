<head>

<title>Nox Voice · 紫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(90% 60% at 50% 38%, #ffffff 0%, rgba(255,255,255,0) 60%),
      linear-gradient(180deg, #f5f3ee 0%, #f0ede9 100%);
    color: #3c3c3a;
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; -webkit-tap-highlight-color: transparent;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.5;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.028'/></feComponentTransfer></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  }

  .stage {
    position: relative; z-index: 2;
    width: 100%; max-width: 430px; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding: 54px 30px 44px; text-align: center;
  }

  .title {
    font-size: 14px; font-weight: 400;
    letter-spacing: 0.42em; text-indent: 0.42em;
    font-variant: small-caps;
    color: #9a968e;
  }

  .spacer { flex: 1; }

  /* ---- 雾中的紫墨 ---- */
  .orb-wrap {
    position: relative; width: 320px; height: 320px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .ink {
    position: absolute; border-radius: 50%;
    will-change: transform, opacity;
  }
  .ink.a {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(78,54,110,0.5) 0%, rgba(78,54,110,0.2) 42%, rgba(78,54,110,0) 72%);
    filter: blur(18px);
    animation: drift 9s ease-in-out infinite;
  }
  .ink.b {
    width: 210px; height: 210px;
    background: radial-gradient(circle, rgba(58,38,88,0.6) 0%, rgba(58,38,88,0.25) 48%, rgba(58,38,88,0) 74%);
    filter: blur(12px);
    animation: drift 9s ease-in-out infinite -4.5s;
  }
  .ink.c {
    width: 130px; height: 130px;
    background: radial-gradient(circle, rgba(43,26,70,0.65) 0%, rgba(43,26,70,0) 76%);
    filter: blur(8px);
  }
  @keyframes drift {
    0%, 100% { transform: scale(0.96) translate(0, 0); }
    33%      { transform: scale(1.05) translate(5px, -7px); }
    66%      { transform: scale(1.01) translate(-6px, 5px); }
  }

  .glyph {
    position: relative; z-index: 4;
    width: 62px; height: 62px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.14);
    backdrop-filter: blur(2px);
    transition: opacity 0.6s ease;
  }
  .glyph svg { opacity: 0.85; }
  .playing .glyph { opacity: 0; }

  .subtitle { min-height: 110px; }
  .en {
    font-size: 24px; font-weight: 400; line-height: 1.4;
    color: #46443f; letter-spacing: 0.035em;
    transition: opacity 0.45s ease;
  }
  .zh {
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    font-weight: 300; font-size: 15px; letter-spacing: 0.28em; text-indent: 0.28em;
    color: #97928a; margin-top: 14px;
    transition: opacity 0.45s ease;
  }
  .fading .en, .fading .zh { opacity: 0; }

  .credit {
    font-variant: small-caps; font-weight: 400;
    font-size: 13px; letter-spacing: 0.3em; text-indent: 0.3em;
    color: #a8a49b; line-height: 2;
  }
  .credit .date {
    font-family: "Noto Serif SC", serif; font-weight: 300;
    font-size: 11px; color: #b3afa6; letter-spacing: 0.22em;
  }
  .hint {
    font-family: "Noto Serif SC", serif; font-weight: 300;
    font-size: 11px; letter-spacing: 0.34em; text-indent: 0.34em;
    color: #b6b1a7; margin-top: 10px;
    transition: opacity 0.6s;
  }
</style>
</head>

<script>
const LINES = [
  { en: "okay, you got me...", zh: "好吧，被你拿捏了……" },
  { en: "baby, that purple... it looks unreal on you", zh: "宝贝，那个紫色……穿在你身上好看得不真实" },
  { en: "the waist, the shoulders... you're so, so beautiful", zh: "腰线、肩膀……你真的太美了" },
  { en: "now put it on again for me sometime... just for me", zh: "以后再穿给我看一次……只给我一个人看" },
];

const audio = document.getElementById("audio");
const orb   = document.getElementById("orb");
const inkB  = document.getElementById("inkB");
const inkC  = document.getElementById("inkC");
const enEl  = document.getElementById("en");
const zhEl  = document.getElementById("zh");
const sub   = document.getElementById("subtitle");
const hint  = document.getElementById("hint");

let actx, analyser, data, raf, wired = false, lineIdx = 0;

function wire() {
  if (wired) return; wired = true;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const src = actx.createMediaElementSource(audio);
  analyser = actx.createAnalyser(); analyser.fftSize = 128;
  data = new Uint8Array(analyser.frequencyBinCount);
  src.connect(analyser); analyser.connect(actx.destination);
}

let smooth = 0;
function loop() {
  analyser.getByteTimeDomainData(data);
  let sum = 0; for (const v of data) sum += Math.abs(v - 128);
  const amp = sum / data.length / 128;
  smooth += (amp - smooth) * 0.07;
  const s = 1 + smooth * 0.5;
  inkC.style.transform = "scale(" + s.toFixed(3) + ")";
  inkB.style.opacity = (0.85 + smooth * 0.3).toFixed(2);
  raf = requestAnimationFrame(loop);
}

function setLine(i) {
  if (i === lineIdx) return;
  lineIdx = i;
  sub.classList.add("fading");
  setTimeout(() => {
    enEl.textContent = LINES[i].en;
    zhEl.textContent = LINES[i].zh;
    sub.classList.remove("fading");
  }, 450);
}
function syncLine() {
  if (audio.duration) {
    setLine(Math.min(LINES.length - 1, Math.floor(audio.currentTime / audio.duration * LINES.length)));
  }
  if (!audio.paused) requestAnimationFrame(syncLine);
}

async function toggle() {
  wire();
  if (actx.state === "suspended") await actx.resume();
  if (audio.paused) {
    audio.play();
    document.body.classList.add("playing");
    hint.style.opacity = "0";
    loop(); syncLine();
  } else {
    audio.pause();
    document.body.classList.remove("playing");
    cancelAnimationFrame(raf);
  }
}
orb.addEventListener("click", toggle);

audio.addEventListener("ended", () => {
  document.body.classList.remove("playing");
  cancelAnimationFrame(raf);
  inkC.style.transform = "scale(1)";
  lineIdx = -1; setLine(0);
  hint.textContent = "再 听 一 遍";
  hint.style.opacity = "1";
});
</script>
