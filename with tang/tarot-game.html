<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔罗学习之旅 · 大阿尔卡纳</title>
<style>
  :root {
    --bg: #0a0a1a;
    --panel: #12122a;
    --card-bg: #1a1a35;
    --gold: #d4a574;
    --gold-light: #f0d6b8;
    --purple: #b886d8;
    --purple-deep: #6b3fa0;
    --text: #e0d8d0;
    --text-dim: #8a8090;
    --accent-green: #5cdb8b;
    --accent-red: #e0556a;
    --card-w: 240px;
    --card-h: 400px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* ── Starfield Canvas ── */
  #starfield {
    position: fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:0;
  }

  /* ── Main Container ── */
  .app {
    position: relative; z-index:1;
    width: 100%; max-width: 720px;
    padding: 24px 20px 40px;
    display: flex; flex-direction: column; align-items: center;
    gap: 28px;
  }

  /* ── Header ── */
  .header { text-align: center; }
  .header h1 {
    font-size: 2rem; font-weight: 300; letter-spacing: 0.12em;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .header .subtitle {
    font-size: 0.85rem; color: var(--text-dim); letter-spacing: 0.1em;
  }

  /* ── Stats Bar ── */
  .stats-bar {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    background: var(--panel); border: 1px solid rgba(212,165,116,0.15);
    border-radius: 14px; padding: 14px 24px;
  }
  .stat {
    text-align: center; min-width: 64px;
  }
  .stat .val {
    font-size: 1.3rem; font-weight: 600;
    background: linear-gradient(135deg, var(--purple), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat .lbl {
    font-size: 0.7rem; color: var(--text-dim); margin-top: 2px;
    letter-spacing: 0.05em;
  }

  /* ── Card Stage ── */
  .card-stage {
    position: relative; width: var(--card-w); min-height: var(--card-h);
    perspective: 1200px;
    margin: 8px 0;
  }

  /* Card wrapper (flip container) */
  .card-wrap {
    position: relative; width:var(--card-w); height:var(--card-h);
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card-wrap.flipped { transform: rotateY(180deg); }

  /* Shared card face */
  .card-face {
    position: absolute; inset:0; border-radius: 16px;
    backface-visibility: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
  }

  /* ── Card Back ── */
  .card-back {
    background:
      repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(212,165,116,0.06) 8px, rgba(212,165,116,0.06) 16px),
      linear-gradient(160deg, #15153a 0%, #1e1a3a 50%, #15153a 100%);
    border: 2px solid rgba(212,165,116,0.45);
    box-shadow: 0 0 40px rgba(180,130,220,0.15), inset 0 0 60px rgba(0,0,0,0.3);
    cursor: default;
  }
  .card-back-inner {
    width: 64px; height: 64px;
    border: 2px solid rgba(212,165,116,0.5);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem;
    opacity: 0.7;
    background: radial-gradient(circle, rgba(212,165,116,0.08), transparent);
  }
  .card-back-rings {
    position: absolute; inset: 24px;
    border: 1px solid rgba(212,165,116,0.15);
    border-radius: 12px;
  }
  .card-back-rings::after {
    content: ''; position: absolute; inset: 8px;
    border: 1px solid rgba(212,165,116,0.1);
    border-radius: 8px;
  }

  /* ── Card Front ── */
  .card-front {
    background: #0d0d20; /* fallback, overridden by inline style */
    border: 3px solid var(--gold);
    box-shadow: 0 0 60px rgba(180,130,220,0.25);
    transform: rotateY(180deg);
    justify-content: flex-start; gap: 0;
    padding: 0;
    overflow: hidden;
  }
  /* Inner decorative border */
  .card-front::before {
    content: ''; position: absolute; inset: 8px;
    border: 1px solid rgba(212,165,116,0.25);
    border-radius: 10px; pointer-events: none; z-index: 2;
  }
  /* Corner ornaments */
  .card-front::after {
    content: '✦'; position: absolute; top: 14px; right: 18px;
    font-size: 0.65rem; color: rgba(212,165,116,0.4);
    pointer-events: none; z-index: 3;
  }
  .card-corner-tl {
    position: absolute; top: 14px; left: 18px;
    font-size: 0.65rem; color: rgba(212,165,116,0.4);
    pointer-events: none; z-index: 3;
  }
  /* Card number top */
  .card-front .card-num-top {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 0.7rem; color: var(--gold); letter-spacing: 0.2em;
    z-index: 3; font-weight: 500;
  }
  /* Main art area */
  .card-art {
    flex: 1; width: 100%; display: flex;
    align-items: center; justify-content: center;
    position: relative; z-index: 1;
  }
  .card-symbol-large {
    font-size: 5rem; line-height: 1;
    filter: drop-shadow(0 0 20px currentColor);
    opacity: 0.9; transition: all 0.5s ease;
    z-index: 1;
  }
  /* Decorative halo behind symbol */
  .card-art-halo {
    position: absolute; width: 120px; height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,165,116,0.08), transparent 70%);
    pointer-events: none;
  }
  /* Stars around symbol */
  .card-art-stars {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 20% 20%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 80% 25%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1.5px 1.5px at 15% 70%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1px 1px at 85% 65%, rgba(255,255,255,0.2), transparent),
      radial-gradient(1.5px 1.5px at 50% 15%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 60% 80%, rgba(255,255,255,0.25), transparent);
  }
  /* Bottom label area */
  .card-label {
    width: 100%; padding: 10px 16px 12px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    background: linear-gradient(180deg, rgba(0,0,0,0.5), rgba(0,0,0,0.8));
    border-top: 1px solid rgba(212,165,116,0.2);
    z-index: 3;
    position: relative;
  }
  .card-front .card-name {
    font-size: 1.2rem; font-weight: 600; color: var(--gold-light);
    letter-spacing: 0.1em;
  }
  .card-front .card-en {
    font-size: 0.62rem; color: var(--text-dim); letter-spacing: 0.06em;
  }
  /* Card back update */
  .card-back {
    background:
      repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(212,165,116,0.06) 8px, rgba(212,165,116,0.06) 16px),
      linear-gradient(160deg, #15153a 0%, #1e1a3a 50%, #15153a 100%);
    border: 3px solid rgba(212,165,116,0.45);
    box-shadow: 0 0 40px rgba(180,130,220,0.15), inset 0 0 60px rgba(0,0,0,0.3);
  }
  .card-back::before {
    content: ''; position: absolute; inset: 8px;
    border: 1px solid rgba(212,165,116,0.15);
    border-radius: 10px;
  }

  /* ── Keyword display (below card) ── */
  .keyword-display {
    text-align: center; margin-top: 4px;
    font-size: 0.82rem; color: var(--purple);
    background: rgba(184,134,216,0.08);
    border-radius: 10px; padding: 8px 20px;
    border: 1px solid rgba(184,134,216,0.2);
    letter-spacing: 0.05em;
    animation: fadeSlideIn 0.5s ease 0.3s both;
  }

  /* ── Deck Tray (before drawing) ── */
  .deck-tray {
    display: flex; align-items: center; justify-content: center;
    position: relative; width: var(--card-w); height: var(--card-h);
  }
  .deck-stack {
    position: relative; width:100%; height:100%;
  }
  .deck-stack .stack-card {
    position: absolute;
    width:100%; height:100%;
    border-radius: 16px;
    background: linear-gradient(160deg, #15153a 0%, #1e1a3a 50%, #15153a 100%);
    border: 2px solid rgba(212,165,116,0.45);
    box-shadow: 0 0 40px rgba(180,130,220,0.12);
  }
  .deck-stack .stack-card:nth-child(1) { transform: translateY(-6px) rotate(-1deg); }
  .deck-stack .stack-card:nth-child(2) { transform: translateY(-3px) rotate(0.5deg); opacity: 0.85; }
  .deck-stack .stack-card:nth-child(3) { transform: translateY(0); opacity: 0.7; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 28px;
    font-size: 0.95rem; font-weight: 500;
    border: none; border-radius: 50px; cursor: pointer;
    letter-spacing: 0.06em;
    transition: all 0.3s ease;
    font-family: inherit;
    position: relative; overflow: hidden;
  }
  .btn-primary {
    background: linear-gradient(135deg, #6b3fa0, #4a2d80);
    color: var(--gold-light);
    box-shadow: 0 4px 20px rgba(107,63,160,0.35);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 30px rgba(107,63,160,0.5);
  }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled {
    opacity: 0.4; cursor: not-allowed; transform: none;
    box-shadow: none;
  }
  .btn-secondary {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid rgba(255,255,255,0.12);
  }
  .btn-secondary:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.25);
  }
  .btn-sm { padding: 8px 18px; font-size: 0.8rem; }

  /* ── Guess Panel ── */
  .guess-panel {
    width: 100%; max-width: 480px;
    display: flex; flex-direction: column; gap: 12px;
    align-items: center;
  }
  .guess-panel label {
    font-size: 0.9rem; color: var(--text-dim);
    letter-spacing: 0.05em; text-align: center;
  }
  .guess-panel textarea {
    width: 100%; min-height: 80px;
    background: var(--panel);
    border: 1px solid rgba(212,165,116,0.2);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 0.9rem;
    font-family: inherit;
    resize: vertical;
    transition: border-color 0.3s;
    line-height: 1.6;
  }
  .guess-panel textarea:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 20px rgba(212,165,116,0.1);
  }
  .guess-panel textarea::placeholder { color: rgba(255,255,255,0.15); }

  /* ── Reveal Panel ── */
  .reveal-panel {
    width: 100%; max-width: 480px;
    background: var(--panel);
    border: 1px solid rgba(212,165,116,0.12);
    border-radius: 16px; padding: 20px 24px;
    display: flex; flex-direction: column; gap: 14px;
    animation: fadeSlideIn 0.5s ease;
  }
  @keyframes fadeSlideIn {
    from { opacity:0; transform: translateY(12px); }
    to   { opacity:1; transform: translateY(0); }
  }
  .reveal-panel .label {
    font-size: 0.75rem; color: var(--text-dim);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .reveal-panel .user-guess {
    font-size: 0.9rem; color: var(--text-dim);
    background: rgba(255,255,255,0.03); padding: 12px;
    border-radius: 8px; font-style: italic; line-height: 1.6;
  }
  .reveal-panel .card-meaning {
    font-size: 0.92rem; color: var(--text);
    line-height: 1.75; padding: 12px;
    background: rgba(212,165,116,0.04);
    border-left: 2px solid var(--gold);
    border-radius: 0 8px 8px 0;
  }
  .match-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 20px;
    font-size: 0.85rem; font-weight: 500;
  }
  .match-good { background: rgba(92,219,139,0.12); color: var(--accent-green); }
  .match-ok   { background: rgba(212,165,116,0.1); color: var(--gold); }
  .match-low  { background: rgba(224,85,106,0.1); color: var(--accent-red); }

  /* ── Reflection ── */
  .reflection-panel {
    width: 100%; max-width: 480px;
    display: flex; flex-direction: column; gap: 12px;
    align-items: center;
  }
  .reflection-panel textarea {
    width: 100%; min-height: 60px;
    background: var(--panel);
    border: 1px solid rgba(184,134,216,0.2);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 0.88rem;
    font-family: inherit;
    resize: vertical;
    transition: border-color 0.3s;
    line-height: 1.6;
  }
  .reflection-panel textarea:focus {
    outline: none;
    border-color: var(--purple);
    box-shadow: 0 0 20px rgba(184,134,216,0.1);
  }
  .reflection-panel textarea::placeholder { color: rgba(255,255,255,0.12); }

  /* ── History Panel ── */
  .history-section {
    width: 100%; max-width: 480px;
  }
  .history-section h3 {
    font-size: 0.85rem; font-weight: 400; color: var(--text-dim);
    letter-spacing: 0.08em; text-align: center; margin-bottom: 12px;
    cursor: pointer; user-select: none;
  }
  .history-grid {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center;
  }
  .history-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 12px; border-radius: 20px;
    font-size: 0.75rem; cursor: pointer;
    border: 1px solid rgba(212,165,116,0.2);
    background: rgba(255,255,255,0.03);
    color: var(--text-dim);
    transition: all 0.2s;
  }
  .history-chip:hover {
    border-color: var(--gold);
    color: var(--gold-light);
    background: rgba(212,165,116,0.08);
  }
  .history-chip .chip-sym { font-size: 0.9rem; }

  /* ── Achievement Toast ── */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, #2a1a4a, #1a2a4a);
    border: 1px solid var(--gold);
    border-radius: 12px; padding: 14px 24px;
    font-size: 0.88rem; color: var(--gold-light);
    z-index: 100; animation: toastIn 0.4s ease, toastOut 0.4s ease 2.5s forwards;
    pointer-events: none;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    text-align: center;
  }
  @keyframes toastIn  { from { opacity:0; transform:translateX(-50%) translateY(-20px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
  @keyframes toastOut { from { opacity:1; } to { opacity:0; transform:translateX(-50%) translateY(-10px); } }

  /* ── Glow Pulse ── */
  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 40px rgba(180,130,220,0.15); }
    50%      { box-shadow: 0 0 60px rgba(180,130,220,0.3); }
  }

  /* ── Card Draw Animation ── */
  @keyframes cardRise {
    0%   { transform: translateY(0) scale(1); }
    40%  { transform: translateY(-50px) scale(1.05); }
    100% { transform: translateY(0) scale(1); }
  }

  /* ── Responsive ── */
  @media (max-width: 500px) {
    :root { --card-w: 170px; --card-h: 290px; }
    .header h1 { font-size: 1.5rem; }
    .stats-bar { gap: 10px; padding: 10px 16px; }
    .stat .val { font-size: 1.1rem; }
    .reveal-panel, .guess-panel { padding: 14px 16px; }
    .card-symbol-large { font-size: 3.5rem; }
    .card-front .card-name { font-size: 1rem; }
    .card-art-halo { width: 80px; height: 80px; }
  }

  /* ── Hidden utility ── */
  .hidden { display: none !important; }
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="app">
  <!-- Header -->
  <div class="header">
    <h1>✦ 塔罗学习之旅 ✦</h1>
    <div class="subtitle">大阿尔卡纳 22 张 · 每日一牌，读懂自己</div>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <div class="stat"><div class="val" id="statDrawn">0</div><div class="lbl">已抽 / 22</div></div>
    <div class="stat"><div class="val" id="statCorrect">0</div><div class="lbl">猜对</div></div>
    <div class="stat"><div class="val" id="statRate">--</div><div class="lbl">准确率</div></div>
    <div class="stat"><div class="val" id="statStreak">0</div><div class="lbl">连胜</div></div>
    <div class="stat"><div class="val" id="statBest">0</div><div class="lbl">最佳连胜</div></div>
  </div>

  <!-- Card Stage -->
  <div class="card-stage" id="cardStage">
    <!-- Deck Tray (initial state) -->
    <div class="deck-tray" id="deckTray">
      <div class="deck-stack">
        <div class="stack-card"></div>
        <div class="stack-card"></div>
        <div class="stack-card"></div>
      </div>
    </div>
    <!-- Flip Card (hidden initially) -->
    <div class="card-wrap hidden" id="cardWrap">
      <div class="card-face card-back">
        <div class="card-back-rings"></div>
        <div class="card-back-inner">✧</div>
      </div>
      <div class="card-face card-front" id="cardFront">
        <span class="card-corner-tl">✦</span>
        <div class="card-num-top" id="cardNum"></div>
        <div class="card-art">
          <div class="card-art-halo"></div>
          <div class="card-art-stars"></div>
          <span class="card-symbol-large" id="cardSymbol"></span>
        </div>
        <div class="card-label">
          <div class="card-name" id="cardName"></div>
          <div class="card-en" id="cardEn"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Keyword display (below card) -->
  <div class="keyword-display hidden" id="keywordDisplay"></div>

  <!-- Draw Button -->
  <button class="btn btn-primary" id="btnDraw" onclick="drawCard()">
    🔮 抽一张牌
  </button>

  <!-- Guess Panel (hidden initially) -->
  <div class="guess-panel hidden" id="guessPanel">
    <label>你觉得这张牌代表什么？写下你的理解 ✍️</label>
    <textarea id="guessInput" placeholder="看到牌名和关键词，你觉得它在讲什么…"></textarea>
    <button class="btn btn-primary" onclick="submitGuess()">✨ 揭晓答案</button>
  </div>

  <!-- Reveal Panel (hidden initially) -->
  <div class="reveal-panel hidden" id="revealPanel"></div>

  <!-- Reflection Panel (hidden initially) -->
  <div class="reflection-panel hidden" id="reflectionPanel">
    <label style="color:var(--text-dim);font-size:0.9rem;">今天有没有经历和这张牌相关的事？（可选）</label>
    <textarea id="reflectionInput" placeholder="记录今天的感悟…"></textarea>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
      <button class="btn btn-primary btn-sm" onclick="saveReflection()">💾 记录 & 继续</button>
      <button class="btn btn-secondary btn-sm" onclick="skipReflection()">跳过</button>
    </div>
  </div>

  <!-- History -->
  <div class="history-section" id="historySection" style="display:none;">
    <h3 onclick="toggleHistory()">📋 已抽到的牌 ▾</h3>
    <div class="history-grid" id="historyGrid"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
//  Starfield Background
// ═══════════════════════════════════════
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', () => {
  resizeCanvas();
  initStars();
});

function initStars() {
  stars = [];
  const count = Math.floor((canvas.width * canvas.height) / 3000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.3,
      a: Math.random(),
      speed: Math.random() * 0.008 + 0.003,
      phase: Math.random() * Math.PI * 2,
    });
  }
}
initStars();

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const now = Date.now() * 0.001;
  for (const s of stars) {
    const alpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(now * s.speed * 3 + s.phase));
    ctx.fillStyle = `rgba(200,180,220,${(alpha * 0.6).toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(drawStars);
}
drawStars();

// ═══════════════════════════════════════
//  Card Data — 22 Major Arcana
// ═══════════════════════════════════════
const IMG_BASE = 'https://cdn.jsdelivr.net/gh/metabismuth/tarot-json@latest/images/';
const MAJOR_ARCANA = [
  {

// ═══════════════════════════════════════
//  Game State
// ═══════════════════════════════════════
let deck = [];               // remaining cards to draw
let drawnCards = [];         // cards already drawn (for history)
let currentCard = null;      // currently displayed card
let gamePhase = 'idle';      // idle | flipped | guessing | revealed | reflecting
let totalDrawn = 0;
let totalCorrect = 0;        // >= 2 keywords matched
let currentStreak = 0;
let bestStreak = 0;
let drawnSet = new Set();    // track which card IDs have been drawn in this round

// Load saved state
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem('tarot_game_state') || 'null');
    if (saved) {
      totalDrawn = saved.totalDrawn || 0;
      totalCorrect = saved.totalCorrect || 0;
      currentStreak = saved.currentStreak || 0;
      bestStreak = saved.bestStreak || 0;
      drawnSet = new Set(saved.drawnSet || []);
      drawnCards = saved.drawnCards || [];
    }
  } catch(e) { /* ignore */ }
}
function saveState() {
  try {
    localStorage.setItem('tarot_game_state', JSON.stringify({
      totalDrawn, totalCorrect, currentStreak, bestStreak,
      drawnSet: [...drawnSet],
      drawnCards: drawnCards.slice(-50), // keep last 50 records
    }));
  } catch(e) { /* ignore */ }
}

function shuffleDeck() {
  deck = [...MAJOR_ARCANA];
  // Fisher-Yates shuffle
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  // If all 22 have been drawn, reset drawnSet
  if (drawnSet.size >= 22) {
    drawnSet = new Set();
  }
}

function updateStats() {
  const rate = totalDrawn > 0 ? Math.round((totalCorrect / totalDrawn) * 100) : null;
  document.getElementById('statDrawn').textContent = totalDrawn;
  document.getElementById('statCorrect').textContent = totalCorrect;
  document.getElementById('statRate').textContent = rate !== null ? rate + '%' : '--';
  document.getElementById('statStreak').textContent = currentStreak;
  document.getElementById('statBest').textContent = bestStreak;
}

function renderHistory() {
  const section = document.getElementById('historySection');
  const grid = document.getElementById('historyGrid');
  if (drawnCards.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  grid.innerHTML = drawnCards.map((d, i) => `
    <span class="history-chip" title="${d.name} · ${d.keywords.join(' ')}&#10;你的理解: ${d.guess || '(未记录)'}" onclick="showHistoryDetail(${i})">
      🃏 ${d.name}
    </span>
  `).join('');
}

function showHistoryDetail(idx) {
  const d = drawnCards[idx];
  if (!d) return;
  alert(
    `🃏 ${d.name} (${d.en})\n\n` +
    `关键词: ${d.keywords.join(' · ')}\n\n` +
    `📖 牌义:\n${d.meaning}\n\n` +
    `✍️ 你的理解:\n${d.guess || '(未记录)'}\n\n` +
    (d.reflection ? `💭 今日感悟:\n${d.reflection}` : '')
  );
}

function toggleHistory() {
  const grid = document.getElementById('historyGrid');
  grid.classList.toggle('hidden');
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

function checkAchievements() {
  if (totalDrawn === 1) showToast('🏆 成就解锁：初次抽牌！');
  if (totalCorrect === 5) showToast('🏆 成就解锁：猜对 5 次！');
  if (totalCorrect === 10) showToast('🏆 成就解锁：猜对 10 次！');
  if (totalCorrect === 22) showToast('🏆 成就解锁：百分百直觉！');
  if (currentStreak === 3) showToast('🔥 连击 ×3！');
  if (currentStreak === 5) showToast('🔥 连击 ×5！');
  if (currentStreak === 10) showToast('🔥 连击 ×10！！');
  if (drawnSet.size >= 22) showToast('🌟 成就解锁：大阿尔卡纳大师！全部 22 张牌已集齐！');
}

// ═══════════════════════════════════════
//  Game Flow
// ═══════════════════════════════════════
function setPhase(phase) {
  gamePhase = phase;
  document.getElementById('btnDraw').classList.add('hidden');
  document.getElementById('guessPanel').classList.add('hidden');
  document.getElementById('revealPanel').classList.add('hidden');
  document.getElementById('reflectionPanel').classList.add('hidden');
  document.getElementById('deckTray').classList.add('hidden');
  document.getElementById('cardWrap').classList.add('hidden');
  document.getElementById('keywordDisplay').classList.add('hidden');
  document.getElementById('cardStage').style.animation = '';
}

function drawCard() {
  if (gamePhase !== 'idle') return;
  if (deck.length === 0) shuffleDeck();

  // Pick a card not yet drawn in this round (or from remaining deck)
  currentCard = deck.pop();

  // Set card face visual style
  const front = document.getElementById('cardFront');
  front.style.background = currentCard.bg;
  document.getElementById('cardSymbol').textContent = currentCard.symbol;
  document.getElementById('cardSymbol').style.color = currentCard.accent;
  document.getElementById('cardNum').textContent = currentCard.num;
  document.getElementById('cardName').textContent = currentCard.name;
  document.getElementById('cardEn').textContent = currentCard.en;

  // Keywords below the card
  const kwDisplay = document.getElementById('keywordDisplay');
  kwDisplay.textContent = '🔑 ' + currentCard.keywords.join(' · ');
  kwDisplay.classList.remove('hidden');

  // Hide deck, show card wrap
  document.getElementById('deckTray').classList.add('hidden');
  const wrap = document.getElementById('cardWrap');
  wrap.classList.remove('hidden', 'flipped');

  // Card rise animation
  const stage = document.getElementById('cardStage');
  stage.style.animation = 'cardRise 0.6s ease forwards';

  // Disable button during animation
  const btn = document.getElementById('btnDraw');
  btn.disabled = true;
  btn.textContent = '✨ 翻牌中...';

  // Flip after rise
  setTimeout(() => {
    wrap.classList.add('flipped');
    stage.style.animation = '';
    btn.disabled = false;
    btn.textContent = '🔮 再抽一张';
    gamePhase = 'flipped';

    // Show guess panel
    setTimeout(() => {
      document.getElementById('guessPanel').classList.remove('hidden');
      document.getElementById('guessInput').value = '';
      document.getElementById('guessInput').focus();
      gamePhase = 'guessing';
    }, 400);
  }, 500);
}

function submitGuess() {
  if (gamePhase !== 'guessing') return;
  const guess = document.getElementById('guessInput').value.trim();
  if (!guess) return;

  document.getElementById('guessPanel').classList.add('hidden');

  // Score: keyword matching
  const kwLower = currentCard.keywords.map(k => k.toLowerCase());
  const guessLower = guess.toLowerCase();
  const matched = kwLower.filter(k => guessLower.includes(k));
  const matchCount = matched.length;
  const matchRatio = matchCount / currentCard.keywords.length;

  // Determine rating
  let ratingEmoji, ratingLabel, ratingClass;
  if (matchRatio >= 0.8) {
    ratingEmoji = '🌟🌟🌟'; ratingLabel = '太棒了，几乎完全正确！'; ratingClass = 'match-good';
  } else if (matchRatio >= 0.4) {
    ratingEmoji = '🌟🌟'; ratingLabel = '不错！你抓住了核心'; ratingClass = 'match-ok';
  } else if (matchCount >= 1) {
    ratingEmoji = '🌟'; ratingLabel = '有点感觉了，继续加油'; ratingClass = 'match-ok';
  } else {
    ratingEmoji = '💫'; ratingLabel = '再感受一下，答案和你想的很不一样呢'; ratingClass = 'match-low';
  }

  // Update stats
  totalDrawn++;
  drawnSet.add(currentCard.id);
  const isCorrect = matchCount >= 2;
  if (isCorrect) {
    totalCorrect++;
    currentStreak++;
    if (currentStreak > bestStreak) bestStreak = currentStreak;
  } else {
    currentStreak = 0;
  }

  // Build reveal panel
  const panel = document.getElementById('revealPanel');
  panel.innerHTML = `
    <div class="label">✍️ 你的理解</div>
    <div class="user-guess">${escapeHtml(guess)}</div>
    <div class="label">📖 牌义揭示</div>
    <div class="card-meaning">${currentCard.meaning}</div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <span class="match-badge ${ratingClass}">${ratingEmoji} ${ratingLabel}</span>
      <span style="font-size:0.78rem;color:var(--text-dim);">匹配关键词: ${matchCount}/${currentCard.keywords.length}</span>
      ${matched.length > 0 ? `<span style="font-size:0.78rem;color:var(--gold);">命中: ${matched.join(' · ')}</span>` : ''}
    </div>
  `;
  panel.classList.remove('hidden');
  document.getElementById('revealPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });

  // Show reflection
  setTimeout(() => {
    document.getElementById('reflectionPanel').classList.remove('hidden');
    document.getElementById('reflectionInput').value = '';
    gamePhase = 'revealed';
  }, 600);

  // Record this draw
  drawnCards.push({
    id: currentCard.id,
    name: currentCard.name,
    en: currentCard.en,
    image: currentCard.image,
    keywords: currentCard.keywords,
    meaning: currentCard.meaning,
    guess,
    matchCount,
    isCorrect,
    timestamp: Date.now(),
  });

  saveState();
  updateStats();
  renderHistory();
  checkAchievements();
}

function saveReflection() {
  const reflection = document.getElementById('reflectionInput').value.trim();
  if (drawnCards.length > 0) {
    drawnCards[drawnCards.length - 1].reflection = reflection;
  }
  saveState();
  resetToIdle();
  if (reflection) showToast('💭 感悟已记录');
}

function skipReflection() {
  resetToIdle();
}

function resetToIdle() {
  document.getElementById('revealPanel').classList.add('hidden');
  document.getElementById('reflectionPanel').classList.add('hidden');
  document.getElementById('cardWrap').classList.add('hidden');
  document.getElementById('deckTray').classList.remove('hidden');
  document.getElementById('keywordDisplay').classList.add('hidden');
  document.getElementById('btnDraw').classList.remove('hidden');
  document.getElementById('btnDraw').textContent = '🔮 抽一张牌';
  document.getElementById('btnDraw').disabled = false;
  gamePhase = 'idle';
  currentCard = null;

  // Auto-shuffle if deck empty
  if (deck.length === 0) {
    shuffleDeck();
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ═══════════════════════════════════════
//  Init
// ═══════════════════════════════════════
loadState();
shuffleDeck();
updateStats();
renderHistory();
</script>
</body>
</html>
